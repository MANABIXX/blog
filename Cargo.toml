[package]
name = "manabixx-blog"
version = "0.1.0"
edition = "2024"
description = "A Rust-powered static publishing engine for MANABIXX Blog"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
walkdir = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
