<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <link rel="stylesheet" href="{{ get_url(path='site.css') }}">
  <link rel="alternate" type="application/atom+xml" title="MANABIXX Blog" href="{{ get_url(path='atom.xml') }}">
</head>
<body>
<header class="site-header"><a class="brand" href="{{ config.base_url }}/">MANABIXX<span> BLOG</span></a><nav><a href="{{ config.base_url }}/">記事</a><a href="{{ get_url(path='about') }}">このブログについて</a><a href="{{ config.base_url }}/summary/">要点まとめ ↗</a></nav></header>
<main>{% block content %}{% endblock %}</main>
<footer class="site-footer"><span>© MANABIXX</span><span>Learn deeply. Think clearly.</span></footer>
</body>
</html>
