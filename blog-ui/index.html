<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="MANABIXX Blogの記事を検索・発見するための学習ライブラリ。">
    <meta name="theme-color" content="#080b12">
    <title>記事を探す | MANABIXX Blog</title>
    <link rel="stylesheet" href="/blog/assets/site.css">
    <style>
      .app-shell{max-width:900px;margin:0 auto;padding:48px 22px 90px}
      .app-search{width:100%;padding:17px 18px;border:1px solid #34445c;border-radius:12px;background:#111722;color:#edf2fa;font:inherit;font-size:1rem;outline:none}
      .app-search:focus{border-color:#a5c8ff;box-shadow:0 0 0 3px #a5c8ff22}
      .app-results{display:grid;gap:12px;margin-top:22px}
      .app-result{display:block;padding:20px;border:1px solid #263142;border-radius:14px;background:#111722}
      .app-result h2{margin:4px 0 8px;font-size:1.12rem}
      .app-result p{margin:0;color:#9aa8bb}
      .app-meta{font-size:.8rem;color:#a5c8ff}
      .app-back{display:inline-block;margin-top:28px;color:#a5c8ff}
      .app-status{color:#9aa8bb;margin:18px 0}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <link data-trunk rel="rust">
  </body>
</html>
