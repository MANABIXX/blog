baseURL = "https://manabixx.github.io/blog/"
locale = "ja-JP"
defaultContentLanguage = "ja"
title = "MANABIXX Blog"
enableRobotsTXT = true
[pagination]
  pagerSize = 5

[module]
  [[module.imports]]
    path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[params]
  mainSections = ["posts"]
  rssFullContent = true

[params.footer]
  since = 2026

[params.dateFormat]
  published = "Jan 02, 2006"
  lastUpdated = "Jan 02, 2006 15:04 MST"

[params.sidebar]
  emoji = "🖥️"
  subtitle = "勉強の工夫と、日々の気づきを。"

  avatar = ""

[params.article]
  math = false
  toc = true
  readingTime = true

[params.article.license]
  enabled = false

[params.comments]
  enabled = false

[params.widgets]
  [[params.widgets.homepage]]
    type = "search"
  [[params.widgets.homepage]]
    type = "archives"
    [params.widgets.homepage.params]
      limit = 5
  [[params.widgets.homepage]]
    type = "categories"
    [params.widgets.homepage.params]
      limit = 10
  [[params.widgets.homepage]]
    type = "tag-cloud"
    [params.widgets.homepage.params]
      limit = 10
  [[params.widgets.page]]
    type = "toc"

[params.colorScheme]
  toggle = true
  default = "auto"

[permalinks]
  posts = "/p/:slug/"
  pages = "/:slug/"

[markup.goldmark.renderer]
  unsafe = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 4
  ordered = true
