name: Build and Deploy MANABIXX Blog (Rust)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
      - name: Install Trunk and WebAssembly target
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install trunk --locked
      - name: Build Leptos interactive blog
        working-directory: blog-ui
        run: trunk build --release
      - name: Build static site with Rust
        run: cargo run --release -- content public https://manabixx.github.io/blog/
      - name: Assemble Leptos application
        run: |
          mkdir -p public/app
          cp -R blog-ui/dist/. public/app/
      - name: Verify generated pages
        run: |
          test -s public/index.html
          test -s public/archives/index.html
          test -s public/about/index.html
          test -s public/search.json
          test -s public/index.xml
          test -s public/sitemap.xml
          test -s public/robots.txt
          test -s public/p/active-recall-7min/index.html
          test -s public/study/for-you/2026-11-16-retry-one-wrong-question/index.html
          grep -q 'noindex,nofollow' public/study/for-you/2026-11-16-retry-one-wrong-question/index.html
          ! grep -q 'retry-one-wrong-question' public/sitemap.xml
          ! grep -q 'retry-one-wrong-question' public/index.xml
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
