name: Build and Deploy MANABIXX Blog (Hexo)
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify output
        run: |
          test -s public/index.html
          test -s public/archives/index.html
          test -s public/about/index.html
          test -s public/atom.xml
          test -s public/sitemap.xml
          test -s public/2026/11/16/start-with-one-question/index.html
          test -s public/2026/11/16/review-without-rereading/index.html
          test -s public/2026/11/16/design-a-study-session/index.html
          ! grep -R -q 'retry-one-wrong-question\|descriptive-answer-structure' public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
