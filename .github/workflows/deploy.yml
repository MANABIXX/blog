name: Build and Deploy MANABIXX Blog + Summary
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@0.21.0

      - name: Build Zola blog
        run: zola build

      - name: Checkout Quartz v4
        run: git clone --depth 1 --branch v4 https://github.com/jackyzha0/quartz.git /tmp/quartz

      - name: Configure and install Quartz
        working-directory: /tmp/quartz
        run: |
          sed -i 's/pageTitle: "Quartz 4"/pageTitle: "MANABIXX 要点まとめ"/' quartz.config.ts
          sed -i 's/baseUrl: "quartz.jzhao.xyz"/baseUrl: "manabixx.github.io"/' quartz.config.ts
          sed -i 's/locale: "en-US"/locale: "ja-JP"/' quartz.config.ts
          npm ci

      - name: Add MANABIXX knowledge notes
        run: |
          mkdir -p /tmp/quartz/content
          cp -a summary/content/. /tmp/quartz/content/

      - name: Build Quartz summary
        working-directory: /tmp/quartz
        run: npx quartz build --output "$GITHUB_WORKSPACE/public/summary" --baseDir "/blog/summary/"

      - name: Verify both sites
        run: |
          test -s public/index.html
          test -s public/about.html
          test -s public/summary/index.html
          test -s public/summary/数学.html
          test -s public/summary/理科.html
          test -s public/summary/英語.html
          test -s public/summary/技術・IT.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
