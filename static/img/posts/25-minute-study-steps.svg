<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">25分の学習手順</title><desc id="desc">準備2分、演習18分、解き直し5分の例</desc>
<rect width="1200" height="630" fill="#f5f5f3"/><text x="70" y="82" fill="#202b34" font-family="sans-serif" font-size="40" font-weight="700">25分の使い方（ひとつの例）</text>
<g font-family="sans-serif"><rect x="70" y="155" width="230" height="250" rx="20" fill="#e7edf2" stroke="#8ea1b1" stroke-width="2"/><text x="185" y="225" text-anchor="middle" fill="#314b5f" font-size="48" font-weight="700">2分</text><text x="185" y="290" text-anchor="middle" fill="#263744" font-size="25" font-weight="700">準備</text><text x="185" y="340" text-anchor="middle" fill="#526777" font-size="18">教材を開く</text><text x="185" y="370" text-anchor="middle" fill="#526777" font-size="18">範囲を決める</text>
<rect x="365" y="155" width="470" height="250" rx="20" fill="#fff0df" stroke="#d7a36e" stroke-width="2"/><text x="600" y="225" text-anchor="middle" fill="#895a2b" font-size="48" font-weight="700">18分</text><text x="600" y="290" text-anchor="middle" fill="#553a22" font-size="25" font-weight="700">演習</text><text x="600" y="340" text-anchor="middle" fill="#795b3c" font-size="18">まず自力で解く</text><text x="600" y="370" text-anchor="middle" fill="#795b3c" font-size="18">止まった所に印を付ける</text>
<rect x="900" y="155" width="230" height="250" rx="20" fill="#e6efe9" stroke="#8eab99" stroke-width="2"/><text x="1015" y="225" text-anchor="middle" fill="#38634c" font-size="48" font-weight="700">5分</text><text x="1015" y="290" text-anchor="middle" fill="#2c4d3a" font-size="25" font-weight="700">確認</text><text x="1015" y="340" text-anchor="middle" fill="#526c5b" font-size="18">答え合わせ</text><text x="1015" y="370" text-anchor="middle" fill="#526c5b" font-size="18">明日の課題を1つ</text>
<path d="M300 280h65m-12 -12 12 12-12 12M835 280h65m-12 -12 12 12-12 12" fill="none" stroke="#d07c35" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="505" fill="#53636d" font-size="20">時間配分は固定ではない。疲れている日は10分から始めてもよい。</text></g></svg>