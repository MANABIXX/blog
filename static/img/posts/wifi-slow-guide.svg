<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">家のWi-Fiが遅いときの確認順</title><desc id="desc">端末、ルーター、回線の順に原因を切り分ける図</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#25323b"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/><circle cx="930" cy="250" r="230" fill="#f4a261" opacity=".08"/>
<text x="80" y="100" fill="#f4a261" font-family="sans-serif" font-size="23" letter-spacing="5">MANABIXX BLOG / DIGITAL</text>
<text x="80" y="205" fill="#f5f7f8" font-family="sans-serif" font-size="58" font-weight="700">Wi-Fiが遅いとき</text>
<text x="80" y="275" fill="#f5f7f8" font-family="sans-serif" font-size="45">買い替える前に、原因を切り分ける</text>
<g transform="translate(820 130)" fill="none" stroke="#f4a261" stroke-width="14" stroke-linecap="round"><path d="M0 100 Q130 -15 260 100"/><path d="M42 145 Q130 70 218 145"/><path d="M84 190 Q130 150 176 190"/><circle cx="130" cy="238" r="10" fill="#f4a261" stroke="none"/></g>
<rect x="80" y="370" width="1040" height="145" rx="24" fill="#17232c" stroke="#50616b" stroke-width="2"/>
<g font-family="sans-serif" text-anchor="middle"><text x="255" y="425" fill="#f5f7f8" font-size="28" font-weight="700">端末</text><text x="255" y="470" fill="#b7c4cb" font-size="19">1台だけ？</text><text x="600" y="425" fill="#f5f7f8" font-size="28" font-weight="700">ルーター</text><text x="600" y="470" fill="#b7c4cb" font-size="19">場所・電波・再起動</text><text x="945" y="425" fill="#f5f7f8" font-size="28" font-weight="700">回線</text><text x="945" y="470" fill="#b7c4cb" font-size="19">複数端末で不調？</text></g>
<path d="M380 445h90m-12 -12 12 12-12 12M730 445h90m-12 -12 12 12-12 12" fill="none" stroke="#f4a261" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="80" y="580" fill="#c4cdd2" font-family="sans-serif" font-size="20">最初に症状を分ければ、不要な設定変更を減らせる。</text></svg>