<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">記述問題の組み立て方</title><desc id="desc">結論、根拠、条件の三段階を左から右へ並べた図。</desc>
<rect width="1200" height="675" rx="36" fill="#111318"/>
<text x="72" y="92" fill="#f5f5f5" font-size="42" font-weight="700" font-family="sans-serif">記述問題の組み立て方</text>
<text x="74" y="135" fill="#a9adb7" font-size="22" font-family="sans-serif">書く前に、答えを3つに分ける</text>
<g font-family="sans-serif">
<rect x="72" y="210" width="320" height="300" rx="24" fill="#222833" stroke="#ff8a24" stroke-width="3"/>
<circle cx="122" cy="270" r="26" fill="#ff8a24"/><text x="122" y="279" fill="#111318" font-size="24" text-anchor="middle" font-weight="700">1</text>
<text x="110" y="350" fill="#ffffff" font-size="38" font-weight="700">結論</text><text x="110" y="405" fill="#c4c8d0" font-size="22">何を答える？</text><text x="110" y="455" fill="#c4c8d0" font-size="19">問いに正面から答える</text>
<path d="M410 360 H455 l-18 -16 m18 16 l-18 16" fill="none" stroke="#ff8a24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="455" y="210" width="320" height="300" rx="24" fill="#222833" stroke="#ff8a24" stroke-width="3"/>
<circle cx="505" cy="270" r="26" fill="#ff8a24"/><text x="505" y="279" fill="#111318" font-size="24" text-anchor="middle" font-weight="700">2</text>
<text x="493" y="350" fill="#ffffff" font-size="38" font-weight="700">根拠</text><text x="493" y="405" fill="#c4c8d0" font-size="22">なぜそう言える？</text><text x="493" y="455" fill="#c4c8d0" font-size="19">資料・式・本文から選ぶ</text>
<path d="M793 360 H838 l-18 -16 m18 16 l-18 16" fill="none" stroke="#ff8a24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="838" y="210" width="290" height="300" rx="24" fill="#222833" stroke="#ff8a24" stroke-width="3"/>
<circle cx="888" cy="270" r="26" fill="#ff8a24"/><text x="888" y="279" fill="#111318" font-size="24" text-anchor="middle" font-weight="700">3</text>
<text x="876" y="350" fill="#ffffff" font-size="38" font-weight="700">条件</text><text x="876" y="405" fill="#c4c8d0" font-size="22">指定を満たした？</text><text x="876" y="455" fill="#c4c8d0" font-size="19">字数・単位・語句を確認</text>
</g>
<text x="72" y="600" fill="#ffb56d" font-size="22" font-family="sans-serif">結論 → 根拠 → 条件</text>
</svg>