<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">間違えた問題の解き直し</title><desc id="desc">答えを隠す、自分で解く、解説と比べて再挑戦する流れを示す図。</desc>
<rect width="1200" height="675" rx="36" fill="#111318"/>
<text x="72" y="92" fill="#f5f5f5" font-size="42" font-weight="700" font-family="sans-serif">間違えた問題を、もう一度</text>
<text x="74" y="135" fill="#a9adb7" font-size="22" font-family="sans-serif">解説を読んで終わりにしない</text>
<g font-family="sans-serif">
<rect x="72" y="220" width="300" height="270" rx="24" fill="#222833" stroke="#ff8a24" stroke-width="3"/>
<circle cx="122" cy="278" r="26" fill="#ff8a24"/><text x="122" y="287" text-anchor="middle" fill="#111318" font-size="24" font-weight="700">1</text>
<text x="110" y="360" fill="#ffffff" font-size="34" font-weight="700">答えを隠す</text><text x="110" y="415" fill="#c4c8d0" font-size="20">問題文と条件を読む</text>
<path d="M390 355 H440 l-18 -16 m18 16 l-18 16" fill="none" stroke="#ff8a24" stroke-width="5" stroke-linecap="round"/>
<rect x="450" y="220" width="300" height="270" rx="24" fill="#222833" stroke="#ff8a24" stroke-width="3"/>
<circle cx="500" cy="278" r="26" fill="#ff8a24"/><text x="500" y="287" text-anchor="middle" fill="#111318" font-size="24" font-weight="700">2</text>
<text x="488" y="360" fill="#ffffff" font-size="34" font-weight="700">自力で解く</text><text x="488" y="415" fill="#c4c8d0" font-size="20">式や根拠を一行残す</text>
<path d="M768 355 H818 l-18 -16 m18 16 l-18 16" fill="none" stroke="#ff8a24" stroke-width="5" stroke-linecap="round"/>
<rect x="828" y="220" width="300" height="270" rx="24" fill="#222833" stroke="#ff8a24" stroke-width="3"/>
<circle cx="878" cy="278" r="26" fill="#ff8a24"/><text x="878" y="287" text-anchor="middle" fill="#111318" font-size="24" font-weight="700">3</text>
<text x="866" y="360" fill="#ffffff" font-size="32" font-weight="700">解説と比べる</text><text x="866" y="415" fill="#c4c8d0" font-size="20">ずれた理由を一言で記録</text>
</g>
<text x="72" y="580" fill="#ffb56d" font-size="23" font-family="sans-serif">一題を、次は自力で解ける状態にする</text>
</svg>