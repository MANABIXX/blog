<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Wi-Fiの切り分け手順</title><desc id="desc">複数端末とルーターの近くで試して原因を絞るフローチャート</desc>
<rect width="1200" height="630" fill="#f3f5f6"/><text x="70" y="78" fill="#25323b" font-family="sans-serif" font-size="38" font-weight="700">Wi-Fiの切り分けは、この順番で</text>
<g font-family="sans-serif"><rect x="70" y="130" width="310" height="125" rx="18" fill="#fff" stroke="#71818a" stroke-width="3"/><text x="225" y="180" text-anchor="middle" fill="#25323b" font-size="25" font-weight="700">別の端末でも遅い？</text><text x="225" y="218" text-anchor="middle" fill="#586a74" font-size="18">スマホ・PCなどで確認</text>
<rect x="445" y="130" width="310" height="125" rx="18" fill="#fff" stroke="#71818a" stroke-width="3"/><text x="600" y="180" text-anchor="middle" fill="#25323b" font-size="25" font-weight="700">ルーターの近くで改善？</text><text x="600" y="218" text-anchor="middle" fill="#586a74" font-size="18">距離・壁・置き場所を確認</text>
<rect x="820" y="130" width="310" height="125" rx="18" fill="#fff" stroke="#71818a" stroke-width="3"/><text x="975" y="180" text-anchor="middle" fill="#25323b" font-size="25" font-weight="700">全端末で遅いまま？</text><text x="975" y="218" text-anchor="middle" fill="#586a74" font-size="18">回線・障害情報を確認</text>
<path d="M380 192h65m-12 -10 12 10-12 10M755 192h65m-12 -10 12 10-12 10" fill="none" stroke="#d97732" stroke-width="5" stroke-linecap="round"/>
<rect x="70" y="340" width="310" height="150" rx="18" fill="#e5f0ed" stroke="#7c9b91" stroke-width="2"/><text x="225" y="390" text-anchor="middle" fill="#214c41" font-size="23" font-weight="700">端末側を確認</text><text x="225" y="430" text-anchor="middle" fill="#355e53" font-size="18">Wi-Fi再接続・機内モード</text><text x="225" y="460" text-anchor="middle" fill="#355e53" font-size="18">VPN等の影響も確認</text>
<rect x="445" y="340" width="310" height="150" rx="18" fill="#fff0df" stroke="#d5a36c" stroke-width="2"/><text x="600" y="390" text-anchor="middle" fill="#71471e" font-size="23" font-weight="700">無線環境を確認</text><text x="600" y="430" text-anchor="middle" fill="#805b32" font-size="18">設置場所・周波数帯</text><text x="600" y="460" text-anchor="middle" fill="#805b32" font-size="18">再起動・更新</text>
<rect x="820" y="340" width="310" height="150" rx="18" fill="#e8edf6" stroke="#8799b8" stroke-width="2"/><text x="975" y="390" text-anchor="middle" fill="#304768" font-size="23" font-weight="700">回線事業者へ相談</text><text x="975" y="430" text-anchor="middle" fill="#4b6286" font-size="18">障害・混雑・契約内容</text><text x="975" y="460" text-anchor="middle" fill="#4b6286" font-size="18">状況を伝えて確認</text>
<text x="70" y="565" fill="#586a74" font-size="18">※設定リセットは最後の手段。学校・職場のネットワークは管理者に相談。</text></g></svg>