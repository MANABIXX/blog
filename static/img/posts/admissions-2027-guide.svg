<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">2027年度入試の公式情報チェック</title><desc id="desc">青藍泰斗と佐野松桜の公式発表を確認するための比較図</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171b24"/><stop offset="1" stop-color="#303746"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/><text x="80" y="96" fill="#efb46c" font-family="sans-serif" font-size="22" letter-spacing="5">MANABIXX BLOG / STUDY NOTES</text>
<text x="80" y="195" fill="#f7f7f4" font-family="sans-serif" font-size="54" font-weight="700">2027年度 入試情報</text>
<text x="80" y="255" fill="#d3d9df" font-family="sans-serif" font-size="32">日程・選抜方法は公式資料で確認</text>
<rect x="80" y="330" width="500" height="190" rx="22" fill="#222d3a" stroke="#62778a" stroke-width="2"/><rect x="620" y="330" width="500" height="190" rx="22" fill="#28372f" stroke="#73917e" stroke-width="2"/>
<g font-family="sans-serif"><text x="120" y="390" fill="#f5f6f7" font-size="30" font-weight="700">青藍泰斗</text><text x="120" y="440" fill="#d1d9df" font-size="22">出願期間・試験回・試験形式</text><text x="120" y="480" fill="#d1d9df" font-size="18">公式入試ページを確認</text><text x="660" y="390" fill="#f5f6f7" font-size="30" font-weight="700">佐野松桜</text><text x="660" y="440" fill="#d1ded6" font-size="22">5教科・特色選抜・独自検査</text><text x="660" y="480" fill="#d1ded6" font-size="18">県教委の学校別PDFを確認</text></g>
<text x="80" y="585" fill="#bac4ce" font-family="sans-serif" font-size="19">倍率・合格点は、公式に確認できない数字を推測しない。</text></svg>