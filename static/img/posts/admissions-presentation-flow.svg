<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">特色選抜のプレゼンテーション準備</title><desc id="desc">自己表現シート、話す内容、質問への応答を順番に準備する図</desc>
<rect width="1200" height="630" fill="#f4f6f4"/><text x="70" y="78" fill="#263d34" font-family="sans-serif" font-size="38" font-weight="700">プレゼンテーションの準備を分ける</text>
<g font-family="sans-serif"><rect x="70" y="150" width="300" height="280" rx="22" fill="#fff" stroke="#9bb0a4" stroke-width="3"/><circle cx="220" cy="220" r="44" fill="#e3efe8"/><text x="220" y="236" text-anchor="middle" fill="#38604c" font-size="40" font-weight="700">1</text><text x="220" y="310" text-anchor="middle" fill="#263d34" font-size="26" font-weight="700">自己表現シート</text><text x="220" y="355" text-anchor="middle" fill="#52675d" font-size="19">志望学科と将来像</text><text x="220" y="388" text-anchor="middle" fill="#52675d" font-size="19">理由を具体化</text>
<rect x="450" y="150" width="300" height="280" rx="22" fill="#fff" stroke="#9bb0a4" stroke-width="3"/><circle cx="600" cy="220" r="44" fill="#e3efe8"/><text x="600" y="236" text-anchor="middle" fill="#38604c" font-size="40" font-weight="700">2</text><text x="600" y="310" text-anchor="middle" fill="#263d34" font-size="26" font-weight="700">口頭で伝える</text><text x="600" y="355" text-anchor="middle" fill="#52675d" font-size="19">結論 → 理由 → 具体例</text><text x="600" y="388" text-anchor="middle" fill="#52675d" font-size="19">時間内にまとめる</text>
<rect x="830" y="150" width="300" height="280" rx="22" fill="#fff" stroke="#9bb0a4" stroke-width="3"/><circle cx="980" cy="220" r="44" fill="#e3efe8"/><text x="980" y="236" text-anchor="middle" fill="#38604c" font-size="40" font-weight="700">3</text><text x="980" y="310" text-anchor="middle" fill="#263d34" font-size="26" font-weight="700">質問に答える</text><text x="980" y="355" text-anchor="middle" fill="#52675d" font-size="19">質問を最後まで聞く</text><text x="980" y="388" text-anchor="middle" fill="#52675d" font-size="19">自分の言葉で説明</text>
<path d="M370 290h80m-13 -12 13 12-13 12M750 290h80m-13 -12 13 12-13 12" fill="none" stroke="#c27d3f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="70" y="510" fill="#52675d" font-size="19">丸暗記より、経験・理由・学科への関心を一貫して説明できるかを練習する。</text></g></svg>