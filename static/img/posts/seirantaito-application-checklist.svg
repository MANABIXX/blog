<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">青藍泰斗高校の出願確認</title><desc id="desc">ネット出願の入力期間、書類提出期限、試験日を順番に確認する図。</desc>
<rect width="1200" height="675" rx="36" fill="#111318"/>
<text x="72" y="92" fill="#f5f5f5" font-size="40" font-weight="700" font-family="sans-serif">出願前の5項目チェック</text>
<text x="74" y="135" fill="#a9adb7" font-size="22" font-family="sans-serif">2027年度・学校公式ページ確認</text>
<g font-family="sans-serif">
<rect x="72" y="200" width="1056" height="90" rx="18" fill="#242a35"/>
<circle cx="125" cy="245" r="25" fill="#ff8a24"/><text x="125" y="253" text-anchor="middle" fill="#111318" font-size="22" font-weight="700">1</text>
<text x="175" y="238" fill="#ffffff" font-size="27" font-weight="700">入力・決済期間</text><text x="175" y="270" fill="#c4c8d0" font-size="20">第1回：2026/11/16〜12/7　／　第2回：2027/1/14〜1/25</text>
<rect x="72" y="310" width="1056" height="90" rx="18" fill="#242a35"/>
<circle cx="125" cy="355" r="25" fill="#ff8a24"/><text x="125" y="363" text-anchor="middle" fill="#111318" font-size="22" font-weight="700">2</text>
<text x="175" y="348" fill="#ffffff" font-size="27" font-weight="700">書類提出</text><text x="175" y="380" fill="#c4c8d0" font-size="20">第1回：12/11　／　第2回：2027/1/26（締切・提出方法を確認）</text>
<rect x="72" y="420" width="1056" height="90" rx="18" fill="#242a35"/>
<circle cx="125" cy="465" r="25" fill="#ff8a24"/><text x="125" y="473" text-anchor="middle" fill="#111318" font-size="22" font-weight="700">3</text>
<text x="175" y="458" fill="#ffffff" font-size="27" font-weight="700">試験区分・受験票</text><text x="175" y="490" fill="#c4c8d0" font-size="20">区分ごとの科目・対象コースを確認し、受験票を印刷</text>
<rect x="72" y="530" width="1056" height="72" rx="18" fill="#382719"/>
<text x="100" y="575" fill="#ffb56d" font-size="22" font-weight="700">決済前に申込内容をPDFで確認する</text>
</g>
</svg>